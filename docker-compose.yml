services:
  postgres:
    image: postgres:15-alpine
    container_name: loan_analyzer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loanadmin
      POSTGRES_PASSWORD: loanpass123
      POSTGRES_DB: loan_eligibility_db
    ports:
      - "5499:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanadmin -d loan_eligibility_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: loan_analyzer_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@loan.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
